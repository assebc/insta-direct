# Builds an installable InstaDirect APK and uploads it as a workflow artifact.
#
# Personal build: signed with the debug keystore that ships with Expo's
# Android template, so every build installs over the previous one. Not for
# Play Store distribution.
name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release:
        description: Existing release tag to replace the APK on (e.g. v1.1.0). Empty creates a new build-N release.
        required: false
        type: string

# One build at a time per branch; a newer push or manual run waits instead
# of cancelling the build already in progress.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

# Write access lets the job create releases.
permissions:
  contents: write

jobs:
  apk:
    # Pinned: ubuntu-latest is moving to Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        # arm64-v8a covers every current Android phone and halves the build time.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: instadirect-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # Every build becomes a GitHub Release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/instadirect.apk
      # A manual run with `release` set replaces the APK on that existing release instead.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          RELEASE: ${{ inputs.release }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk instadirect.apk
          if [ -n "$RELEASE" ]; then
            gh release upload "$RELEASE" instadirect.apk --clobber
            gh release edit "$RELEASE" --latest
            exit 0
          fi
          gh release create "$TAG" instadirect.apk \
            --target "$GITHUB_SHA" \
            --title "InstaDirect $TAG" \
            --notes "Built from ${GITHUB_SHA::7}. Debug-signed personal build." \
            --latest
